<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="DIPO QR Barcode Studio">

  <title>Barcode Studio | DIPO QR</title>

  <style>
    :root {
      --bg:#07110b;
      --card:#0d1a11;
      --text:#f4f8f5;
      --muted:#9baa9f;
      --green:#22c55e;
      --border:rgba(255,255,255,.09);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,sans-serif;
    }

    a {
      color:inherit;
      text-decoration:none;
    }

    header {
      min-height:65px;
      padding:0 5%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--border);
    }

    .logo {
      font-weight:800;
    }

    .logo span {
      color:var(--green);
    }

    main {
      width:min(950px,92%);
      margin:auto;
      padding:45px 0 80px;
    }

    h1 {
      font-size:clamp(2rem,6vw,3.3rem);
      margin-bottom:8px;
    }

    .intro {
      color:var(--muted);
      margin-bottom:25px;
    }

    .panel {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:24px;
    }

    .field {
      margin-bottom:18px;
    }

    label {
      display:block;
      margin-bottom:7px;
      font-size:.85rem;
      font-weight:650;
    }

    input,
    select {
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#07110b;
      color:var(--text);
    }

    .preview {
      min-height:260px;
      background:#fff;
      color:#111;
      border-radius:14px;
      margin:20px 0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:auto;
    }

    #barcode-output {
      min-width:280px;
      min-height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .actions {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    button,
    .button {
      padding:11px 16px;
      border:0;
      border-radius:10px;
      background:var(--green);
      color:#031008;
      font-weight:750;
      cursor:pointer;
    }

    .secondary {
      background:rgba(255,255,255,.07);
      color:var(--text);
      border:1px solid var(--border);
    }
  </style>
</head>

<body>

<header>
  <a href="./index.html" class="logo">
    DIPO<span>QR</span>
  </a>

  <a href="./index.html">← QR Home</a>
</header>

<main
  data-page="barcode"
  data-module="barcode-generator">

  <h1>Barcode Studio</h1>

  <p class="intro">
    Generate and prepare supported barcode formats.
  </p>

  <section class="panel">

    <div class="field">

      <label for="barcode-value">
        Barcode Value
      </label>

      <input
        id="barcode-value"
        data-barcode-value
        type="text"
        placeholder="Enter barcode value">
    </div>

    <div class="field">

      <label for="barcode-format">
        Barcode Format
      </label>

      <select
        id="barcode-format"
        data-barcode-format>

        <option value="CODE128">
          CODE128
        </option>

        <option value="EAN13">
          EAN-13
        </option>

        <option value="UPC">
          UPC
        </option>

        <option value="CODE39">
          CODE39
        </option>

      </select>
    </div>

    <div class="actions">

      <button
        type="button"
        data-action="generate-barcode">
        Generate Barcode
      </button>

      <button
        type="button"
        class="secondary"
        data-action="clear-barcode">
        Clear
      </button>

    </div>

    <div
      class="preview"
      id="barcode-preview"
      data-barcode-preview>

      <div
        id="barcode-output"
        data-barcode-output>
        Barcode Preview
      </div>

    </div>

    <div class="actions">

      <button
        type="button"
        class="secondary"
        data-action="download-barcode">
        Download
      </button>

      <a
        href="./export.html"
        class="button secondary">
        Export Center
      </a>

    </div>

  </section>

</main>

</body>
</html>
