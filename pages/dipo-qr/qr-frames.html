<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="DIPO QR Frames - Customize QR presentation frames.">

  <title>QR Frames | DIPO QR</title>

  <style>
    :root {
      --bg:#07110b;
      --card:#0d1a11;
      --text:#f4f8f5;
      --muted:#9baa9f;
      --green:#22c55e;
      --border:rgba(255,255,255,.09);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,sans-serif;
    }

    a {
      color:inherit;
      text-decoration:none;
    }

    header {
      min-height:65px;
      padding:0 5%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--border);
    }

    .logo {
      font-weight:800;
    }

    .logo span {
      color:var(--green);
    }

    main {
      width:min(1000px,92%);
      margin:auto;
      padding:45px 0 80px;
    }

    h1 {
      font-size:clamp(2rem,6vw,3.3rem);
      margin-bottom:8px;
    }

    .intro {
      color:var(--muted);
      margin-bottom:25px;
    }

    .layout {
      display:grid;
      grid-template-columns:320px 1fr;
      gap:18px;
    }

    .panel {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:22px;
    }

    .field {
      margin-bottom:17px;
    }

    label {
      display:block;
      margin-bottom:7px;
      font-size:.85rem;
    }

    input,
    select {
      width:100%;
      padding:11px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#07110b;
      color:var(--text);
    }

    .frames {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:15px;
    }

    .frame-option {
      padding:14px 8px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#07110b;
      color:var(--text);
      cursor:pointer;
      text-align:center;
    }

    .frame-option.active {
      border-color:var(--green);
      background:rgba(34,197,94,.08);
    }

    .canvas {
      min-height:420px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      border-radius:14px;
      color:#111;
    }

    #frame-output {
      width:300px;
      min-height:330px;
      padding:25px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:15px;
      border:3px solid #111;
    }

    #frame-qr {
      width:210px;
      height:210px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #frame-label {
      font-weight:800;
      text-align:center;
    }

    .actions {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
    }

    button,
    .button {
      padding:11px 16px;
      border-radius:10px;
      border:0;
      background:var(--green);
      color:#031008;
      font-weight:750;
      cursor:pointer;
    }

    .secondary {
      background:rgba(255,255,255,.07);
      color:var(--text);
      border:1px solid var(--border);
    }

    @media(max-width:720px) {
      .layout {
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="./index.html" class="logo">
    DIPO<span>QR</span>
  </a>

  <a href="./index.html">← QR Home</a>
</header>

<main
  data-page="qr-frames"
  data-module="qr-frames">

  <h1>QR Frames</h1>

  <p class="intro">
    Add a frame, label and presentation style to your QR design.
  </p>

  <section class="layout">

    <div class="panel">

      <div class="field">
        <label for="frame-data">
          QR Content
        </label>

        <input
          id="frame-data"
          data-frame-data
          type="text"
          placeholder="Enter URL or text">
      </div>

      <div class="field">
        <label for="frame-label-input">
          Frame Label
        </label>

        <input
          id="frame-label-input"
          data-frame-label
          type="text"
          placeholder="SCAN ME">
      </div>

      <div class="field">

        <label>Choose Frame</label>

        <div
          class="frames"
          data-frame-selector>

          <button
            type="button"
            class="frame-option active"
            data-frame="simple">
            Simple
          </button>

          <button
            type="button"
            class="frame-option"
            data-frame="rounded">
            Rounded
          </button>

          <button
            type="button"
            class="frame-option"
            data-frame="banner">
            Banner
          </button>

          <button
            type="button"
            class="frame-option"
            data-frame="scan">
            Scan Me
          </button>

        </div>

      </div>

      <div class="actions">

        <button
          type="button"
          data-action="generate-frame">
          Generate
        </button>

        <a
          href="./export.html"
          class="button secondary">
          Export
        </a>

      </div>

    </div>

    <div class="panel">

      <div
        class="canvas"
        data-frame-preview>

        <div
          id="frame-output"
          data-frame-output>

          <div
            id="frame-qr"
            data-frame-qr>
            QR
          </div>

          <div
            id="frame-label"
            data-frame-label-output>
            SCAN ME
          </div>

        </div>

      </div>

    </div>

  </section>

</main>

</body>
</html>
