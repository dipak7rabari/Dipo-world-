<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="DIPO QR Export Center - Export QR codes and barcodes.">

  <title>Export Center | DIPO QR</title>

  <style>
    :root {
      --bg:#07110b;
      --card:#0d1a11;
      --text:#f4f8f5;
      --muted:#9baa9f;
      --green:#22c55e;
      --border:rgba(255,255,255,.09);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,sans-serif;
    }

    a {
      color:inherit;
      text-decoration:none;
    }

    header {
      min-height:65px;
      padding:0 5%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--border);
    }

    .logo {
      font-weight:800;
    }

    .logo span {
      color:var(--green);
    }

    main {
      width:min(950px,92%);
      margin:auto;
      padding:45px 0 80px;
    }

    h1 {
      font-size:clamp(2rem,6vw,3.3rem);
      margin-bottom:8px;
    }

    .intro {
      color:var(--muted);
      margin-bottom:25px;
    }

    .panel {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:24px;
      margin-bottom:18px;
    }

    .preview {
      min-height:330px;
      border-radius:14px;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #export-preview {
      width:260px;
      height:260px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .formats {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-top:18px;
    }

    .format {
      padding:18px;
      border-radius:13px;
      background:#07110b;
      border:1px solid var(--border);
      color:var(--text);
      cursor:pointer;
      text-align:left;
    }

    .format:hover,
    .format.active {
      border-color:var(--green);
      background:rgba(34,197,94,.07);
    }

    .format strong {
      display:block;
      margin-bottom:5px;
    }

    .format span {
      color:var(--muted);
      font-size:.82rem;
    }

    .actions {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:20px;
    }

    button,
    .button {
      padding:11px 17px;
      border:0;
      border-radius:10px;
      background:var(--green);
      color:#031008;
      font-weight:750;
      cursor:pointer;
    }

    .secondary {
      background:rgba(255,255,255,.07);
      color:var(--text);
      border:1px solid var(--border);
    }

    .info {
      color:var(--muted);
      font-size:.88rem;
      margin-top:15px;
    }

    @media(max-width:600px) {
      .formats {
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="./index.html" class="logo">
    DIPO<span>QR</span>
  </a>

  <a href="./index.html">← QR Home</a>
</header>

<main
  data-page="qr-export"
  data-module="qr-export">

  <h1>Export Center</h1>

  <p class="intro">
    Preview your QR or barcode and choose an export format.
  </p>

  <section class="panel">

    <div
      class="preview"
      id="export-preview"
      data-export-preview>

      <div
        id="export-output"
        data-export-output>
        Export Preview
      </div>

    </div>

    <p
      class="info"
      data-export-status>
      Select an export format.
    </p>

  </section>

  <section class="panel">

    <h2>Export Format</h2>

    <div
      class="formats"
      data-export-formats>

      <button
        type="button"
        class="format active"
        data-format="png">

        <strong>PNG</strong>

        <span>
          High quality raster image
        </span>

      </button>

      <button
        type="button"
        class="format"
        data-format="svg">

        <strong>SVG</strong>

        <span>
          Scalable vector graphic
        </span>

      </button>

      <button
        type="button"
        class="format"
        data-format="jpg">

        <strong>JPG</strong>

        <span>
          Standard image format
        </span>

      </button>

      <button
        type="button"
        class="format"
        data-format="print">

        <strong>Print</strong>

        <span>
          Prepare QR for printing
        </span>

      </button>

    </div>

    <div class="actions">

      <button
        type="button"
        data-action="export">
        Export
      </button>

      <button
        type="button"
        class="secondary"
        data-action="copy-image">
        Copy
      </button>

      <button
        type="button"
        class="secondary"
        data-action="print">
        Print
      </button>

    </div>

  </section>

</main>

</body>
</html>
