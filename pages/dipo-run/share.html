<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#063b3d"
  >

  <meta
    name="description"
    content="Shared project powered by DIPO RUN."
  >

  <title>DIPO RUN — Shared Project</title>

  <style>

    :root {
      --deep: #063b3d;
      --green: #4caf78;
      --mint: #e4f6e9;
      --ice: #f4faf6;
      --white: #ffffff;
      --text: #092d2f;
      --muted: #718284;
      --border: #dce9e3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 90% 0%,
          rgba(76,175,120,.18),
          transparent 30%
        ),
        var(--ice);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {

      width: min(1000px, 92%);

      margin: auto;

      padding: 35px 0 70px;

    }

    .brand {

      display: flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 45px;

    }

    .brand-icon {

      width: 48px;
      height: 48px;

      border-radius: 16px;

      display: grid;
      place-items: center;

      background: var(--deep);
      color: white;

      font-size: 24px;
      font-weight: 950;

      box-shadow:
        0 0 0 7px
        rgba(76,175,120,.12);

    }

    .brand-name {

      font-size: 21px;
      font-weight: 950;

    }

    .brand-name span {
      color: var(--green);
    }

    .hero {

      padding: 32px;

      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #eff9f1
        );

      border:
        1px solid var(--border);

      box-shadow:
        0 20px 60px
        rgba(6,59,61,.09);

    }

    .eyebrow {

      display: inline-block;

      padding: 8px 13px;

      border-radius: 999px;

      background: var(--mint);

      color: var(--green);

      font-size: 10px;
      font-weight: 950;
      letter-spacing: 1.2px;

      margin-bottom: 17px;

    }

    h1 {

      font-size:
        clamp(38px, 7vw, 70px);

      line-height: .95;

      letter-spacing: -4px;

      color: var(--deep);

      margin-bottom: 15px;

    }

    .description {

      color: var(--muted);

      font-size: 16px;

      line-height: 1.6;

    }

    .preview {

      margin-top: 22px;

      overflow: hidden;

      border-radius: 23px;

      border:
        1px solid var(--border);

      background: white;

      box-shadow:
        0 15px 45px
        rgba(6,59,61,.10);

    }

    .preview-bar {

      height: 40px;

      display: flex;
      align-items: center;

      gap: 6px;

      padding: 0 14px;

      background: #f3f7f5;

      border-bottom:
        1px solid var(--border);

    }

    .dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #bbc8c8;

    }

    #sharedOutput {

      width: 100%;

      min-height: 430px;

      display: block;

      border: 0;

      background: white;

    }

    .actions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 16px;

    }

    .btn {

      min-height: 48px;

      border: 0;

      border-radius: 15px;

      cursor: pointer;

      font-weight: 950;

    }

    .btn-primary {

      background: var(--deep);

      color: white;

    }

    .btn-secondary {

      background: white;

      color: var(--deep);

      border:
        1px solid var(--border);

    }

    .footer {

      margin-top: 30px;

      text-align: center;

      color: var(--muted);

      font-size: 11px;

      font-weight: 700;

    }

    @media(max-width:600px) {

      .page {
        padding-top: 22px;
      }

      .hero {
        padding: 22px;
        border-radius: 24px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      #sharedOutput {
        min-height: 350px;
      }

    }

  </style>

</head>

<body>

  <main class="page">

    <div class="brand">

      <div class="brand-icon">
        D
      </div>

      <div class="brand-name">
        DIPO <span>WORLD</span>
      </div>

    </div>


    <section class="hero">

      <div class="eyebrow">
        DIPO RUN • SHARED PROJECT
      </div>

      <h1>
        Made with
        DIPO RUN.
      </h1>

      <p class="description">
        A project created and shared through
        the DIPO WORLD creative coding ecosystem.
      </p>


      <div class="preview">

        <div class="preview-bar">

          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>

        </div>

        <iframe
          id="sharedOutput"
          title="Shared DIPO RUN project"
          sandbox="allow-scripts allow-forms allow-modals"
        ></iframe>

      </div>


      <div class="actions">

        <button
          class="btn btn-primary"
          id="openBtn"
          type="button"
        >
          ✦ Open in DIPO RUN
        </button>

        <button
          class="btn btn-secondary"
          id="shareBtn"
          type="button"
        >
          ↗ Share
        </button>

      </div>

    </section>


    <footer class="footer">

      DIPO RUN · DIPO WORLD ·
      Made With ❤️ in India

    </footer>

  </main>


  <script>

    const output =
      document.getElementById(
        "sharedOutput"
      );

    const openBtn =
      document.getElementById(
        "openBtn"
      );

    const shareBtn =
      document.getElementById(
        "shareBtn"
      );


    /*
      Temporary shared-project foundation.

      Later share.js will read a
      secure project payload from the URL.
    */

    const savedCode =
      sessionStorage.getItem(
        "dipo-run-code"
      );


    if (savedCode) {

      output.srcdoc =
        savedCode;

    } else {

      output.srcdoc = `

        <html>

          <body style="
            margin:0;
            min-height:100vh;
            display:grid;
            place-items:center;
            font-family:Arial,sans-serif;
            background:#f4faf6;
            color:#063b3d;
            text-align:center;
          ">

            <div>

              <div style="
                font-size:45px;
                margin-bottom:12px;
              ">
                ✦
              </div>

              <h2>
                DIPO RUN
              </h2>

              <p style="
                color:#718284;
              ">
                Shared preview is ready.
              </p>

            </div>

        </body>

        </html>

      `;

    }


    openBtn.addEventListener(
      "click",
      () => {

        window.location.href =
          "index.html";

      }
    );


    shareBtn.addEventListener(
      "click",
      async () => {

        const shareData = {

          title:
            "DIPO RUN — DIPO WORLD",

          text:
            "Check out this project made with DIPO RUN.",

          url:
            window.location.href

        };


        if (
          navigator.share
        ) {

          try {

            await navigator.share(
              shareData
            );

          } catch (error) {

            /* User cancelled share */

          }

        } else {

          try {

            await navigator.clipboard.writeText(
              window.location.href
            );

            shareBtn.textContent =
              "✓ Link Copied";

            setTimeout(
              () => {
                shareBtn.textContent =
                  "↗ Share";
              },
              1800
            );

          } catch (error) {

            alert(
              "Copy the page link to share."
            );

          }

        }

      }
    );

  </script>

</body>
</html>
