<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#063b3d"
  >

  <title>DIPO RUN Preview</title>

  <style>

    :root {
      --deep: #063b3d;
      --green: #4caf78;
      --ice: #f3faf6;
      --white: #ffffff;
      --border: #dce9e3;
      --muted: #718284;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(76,175,120,.15),
          transparent 30%
        ),
        var(--ice);

      color: var(--deep);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .preview-page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 72px;

      padding:
        12px
        max(16px, 3vw);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      background:
        rgba(255,255,255,.9);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid var(--border);
    }

    .back {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: var(--deep);
      color: white;

      font-size: 20px;
      font-weight: 900;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 17px;
      font-weight: 950;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 7px 10px;

      border-radius: 999px;

      background: #e7f7ec;
      color: var(--green);

      font-size: 10px;
      font-weight: 900;
    }

    .live-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--green);

      animation: pulse 1.5s infinite;
    }

    .stage {
      flex: 1;

      display: grid;
      place-items: center;

      padding: 24px;
    }

    .device {
      width: min(100%, 900px);
      min-height: 600px;

      overflow: hidden;

      border-radius: 28px;

      background: white;

      border:
        1px solid var(--border);

      box-shadow:
        0 25px 70px
        rgba(6,59,61,.15);
    }

    .device-bar {
      height: 42px;

      display: flex;
      align-items: center;

      gap: 7px;

      padding: 0 15px;

      background: #f4f7f6;

      border-bottom:
        1px solid #e5eeee;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #bdc9c9;
    }

    #output {
      width: 100%;
      min-height: 558px;

      border: 0;
      background: white;
    }

    .bottom {
      padding: 16px;

      display: flex;
      justify-content: center;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }

    @keyframes pulse {

      0%,100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(.7);
        opacity: .55;
      }

    }

    @media(max-width:600px) {

      .stage {
        padding: 12px;
      }

      .device {
        min-height: calc(100vh - 120px);
        border-radius: 21px;
      }

      #output {
        min-height: calc(100vh - 162px);
      }

    }

  </style>
</head>

<body>

  <div class="preview-page">

    <header class="topbar">

      <a
        href="index.html"
        class="back"
        aria-label="Back"
      >
        ←
      </a>

      <div class="title">
        DIPO RUN
      </div>

      <div class="live">
        <span class="live-dot"></span>
        LIVE
      </div>

    </header>


    <main class="stage">

      <div class="device">

        <div class="device-bar">

          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>

        </div>

        <iframe
          id="output"
          title="DIPO RUN Preview"
          sandbox="allow-scripts allow-forms allow-modals"
        ></iframe>

      </div>

    </main>


    <footer class="bottom">
      DIPO RUN · DIPO WORLD
    </footer>

  </div>


  <script>

    const output =
      document.getElementById("output");

    /*
      Preview engine will receive
      generated code from preview.js.
    */

    const savedCode =
      sessionStorage.getItem(
        "dipo-run-code"
      );

    if (savedCode) {

      output.srcdoc =
        savedCode;

    }

  </script>

</body>
</html>
