<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIPO BIO — Remix</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
.container{width:min(950px,92%);margin:auto}
header{padding:20px 0;border-bottom:1px solid #222}
.nav{display:flex;justify-content:space-between}.logo{font-size:23px;font-weight:bold}.logo span{color:#00ff66}
a{color:#aaa;text-decoration:none}
main{padding:45px 0}
.panel{background:#0d0d0d;border:1px solid #252525;border-radius:18px;padding:25px}
textarea{width:100%;min-height:150px;background:#080808;color:#fff;border:1px solid #333;border-radius:12px;padding:15px;resize:vertical}
select{margin-top:15px;width:100%;padding:13px;background:#080808;color:#fff;border:1px solid #333;border-radius:10px}
button{margin-top:18px;padding:13px 18px;border:0;border-radius:10px;background:#00ff66;font-weight:bold}
.result{margin-top:25px;padding:20px;background:#050505;border:1px solid #252525;border-radius:12px;white-space:pre-wrap;line-height:1.6}
.copy{background:#222;color:#fff;margin-left:7px}
</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">DIPO<span>BIO</span></div>
<a href="index.html">← Bio Tools</a>
</div>
</header>

<main class="container">

<h1>Bio Remix</h1>
<p style="color:#888;margin-bottom:25px">
Transform your existing bio into a new style.
</p>

<div class="panel">

<textarea id="input" placeholder="Paste your existing bio here..."></textarea>

<select id="style">
<option value="clean">Clean</option>
<option value="creator">Creator</option>
<option value="gaming">Gaming</option>
<option value="aesthetic">Aesthetic</option>
<option value="professional">Professional</option>
</select>

<button onclick="remix()">Remix Bio</button>

<div class="result" id="result">
Your remixed bio will appear here.
</div>

<button class="copy" onclick="copyResult()">Copy</button>

</div>
</main>

<script>
function remix(){

 const input=document.getElementById("input").value.trim();

 if(!input){
   document.getElementById("result").textContent="Please enter your bio first.";
   return;
 }

 const style=document.getElementById("style").value;

 let result=input;

 if(style==="clean"){
   result=input
    .replace(/[🔥✨🚀🎮💻❤️⭐🌟]/g,"")
    .replace(/\s+/g," ")
    .trim();
 }

 if(style==="creator"){
   result="🎬 "+input+"\n✨ Creating • Building • Growing";
 }

 if(style==="gaming"){
   result="🎮 "+input+"\n🔥 Gamer • Creator\n⚡ Level up every day";
 }

 if(style==="aesthetic"){
   result="✦ "+input+"\n♡ dream • create • repeat ♡";
 }

 if(style==="professional"){
   result="◆ "+input+"\nBuilding ideas into reality.";
 }

 document.getElementById("result").textContent=result;
 localStorage.setItem("dipoBio",result);
}

function copyResult(){
 navigator.clipboard.writeText(
  document.getElementById("result").textContent
 );
}
</script>

</body>
</html>
