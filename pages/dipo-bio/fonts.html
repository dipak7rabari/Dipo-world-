<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">

<title>DIPO BIO — 2050 Stylish Fonts</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:#f8fafc;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea,select{font:inherit}

.container{
  width:min(1080px,94%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #e7eaf0;
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:28px;
  font-weight:950;
  letter-spacing:-2px;
}

.logo span{
  color:#2859d7;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-btn{
  text-decoration:none;
  border:1px solid #e3e7ed;
  background:#fff;
  color:#222;
  padding:9px 13px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
}

.nav-btn.ai{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* MAIN */

main{
  padding:34px 0 85px;
}

/* HERO */

.hero{
  margin-bottom:25px;
}

.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#2859d7;
  background:#eef3ff;
  border:1px solid #dce5ff;
  border-radius:50px;
  padding:8px 13px;
  font-size:10px;
  font-weight:950;
  letter-spacing:1.3px;
}

.random-btn{
  border:1px solid #e1e5eb;
  background:#fff;
  color:#222;
  border-radius:12px;
  padding:9px 13px;
  cursor:pointer;
  font-size:11px;
  font-weight:950;
}

h1{
  margin:14px 0 9px;
  font-size:clamp(44px,8vw,78px);
  line-height:.92;
  letter-spacing:-4px;
}

.subtitle{
  margin:0;
  color:#737b88;
  font-size:17px;
}

/* INPUT */

.input-box{
  background:#fff;
  border:1px solid #e2e6ed;
  border-radius:26px;
  padding:14px;
  box-shadow:0 15px 45px rgba(20,30,50,.07);
  margin-bottom:12px;
}

.input-wrap{
  position:relative;
}

textarea{
  width:100%;
  height:115px;
  resize:none;
  border:2px solid #e5e9ef;
  border-radius:19px;
  background:#fafbfc;
  outline:none;
  padding:19px 75px 19px 19px;
  font-size:27px;
  color:#111;
  transition:.2s ease;
}

textarea:focus{
  border-color:#2859d7;
  background:#fff;
}

.counter{
  position:absolute;
  right:17px;
  top:15px;
  color:#9ba2ad;
  font-size:12px;
  font-weight:900;
}

/* TOOLBAR */

.toolbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
  margin-bottom:14px;
}

.search-box{
  min-height:46px;
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid #e2e6ed;
  border-radius:13px;
  padding:0 13px;
}

.search-box span{
  font-size:17px;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px;
}

.tool-btn{
  min-height:46px;
  border:1px solid #e2e6ed;
  background:#fff;
  border-radius:13px;
  padding:0 14px;
  cursor:pointer;
  font-size:11px;
  font-weight:950;
}

.tool-btn:hover{
  border-color:#2859d7;
}

.tool-btn.active{
  background:#2859d7;
  color:#fff;
  border-color:#2859d7;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:2px 0 10px;
  scrollbar-width:none;
  margin-bottom:16px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  flex:0 0 auto;
  border:1px solid #e0e4ea;
  background:#fff;
  color:#656d79;
  border-radius:50px;
  padding:9px 13px;
  cursor:pointer;
  font-size:10px;
  font-weight:950;
}

.category-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* STATS */

.stats{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:8px 0 15px;
}

.stats-title{
  font-size:20px;
  font-weight:950;
  letter-spacing:-.5px;
}

.stats-count{
  color:#8b929e;
  font-size:11px;
  font-weight:900;
}

/* GRID */

.font-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

/* CARD */

.font-card{
  position:relative;
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:18px;
  padding:13px;
  min-height:145px;
  overflow:hidden;
  transition:.18s ease;
}

.font-card:hover{
  transform:translateY(-2px);
  border-color:#b8c7f5;
  box-shadow:0 10px 30px rgba(30,50,100,.07);
}

.font-card.favorite{
  border-color:#e0a900;
  background:#fffdf4;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  padding-bottom:8px;
  border-bottom:1px solid #edf0f4;
}

.font-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#69717d;
  font-size:9px;
  font-weight:950;
  letter-spacing:1px;
  text-transform:uppercase;
}

.badge{
  flex:0 0 auto;
  background:#f1f3f6;
  color:#777f8c;
  border-radius:7px;
  padding:5px 7px;
  font-size:7px;
  font-weight:950;
}

.badge.new{
  background:#eef8f3;
  color:#168b54;
}

.badge.god{
  background:#fff3d8;
  color:#a76d00;
}

.badge.trending{
  background:#fff0f4;
  color:#d43b67;
}

.preview{
  height:52px;
  display:flex;
  align-items:center;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:19px;
  line-height:1;
  margin:8px 0;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
}

.action{
  border:0;
  border-radius:9px;
  padding:8px 11px;
  cursor:pointer;
  font-size:9px;
  font-weight:950;
}

.copy-btn{
  background:#2859d7;
  color:#fff;
}

.copy-btn.done{
  background:#168b54;
}

.remix-btn{
  background:#f0f2f5;
  color:#333;
}

.favorite-btn{
  width:33px;
  padding:0;
  background:#fff;
  border:1px solid #e2e5ea;
  color:#9299a4;
}

.favorite-btn.active{
  color:#e5a500;
  border-color:#f0c65a;
  background:#fffaf0;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  padding:60px 20px;
  color:#8c939e;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:22px;
  transform:translate(-50%,130px);
  background:#111827;
  color:#fff;
  border-radius:15px;
  padding:14px 20px;
  font-size:12px;
  font-weight:950;
  box-shadow:0 15px 40px rgba(0,0,0,.22);
  transition:.3s ease;
}

.toast.show{
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:650px){

  .container{
    width:92%;
  }

  .nav{
    min-height:62px;
  }

  .logo{
    font-size:23px;
  }

  .nav-btn{
    padding:8px 10px;
    font-size:10px;
  }

  main{
    padding:27px 0 70px;
  }

  h1{
    font-size:48px;
    letter-spacing:-3px;
  }

  .subtitle{
    font-size:15px;
  }

  .hero-top{
    align-items:flex-start;
  }

  .random-btn{
    font-size:9px;
    padding:8px 9px;
  }

  textarea{
    height:92px;
    font-size:22px;
    padding:16px 60px 16px 16px;
  }

  .toolbar{
    grid-template-columns:1fr auto;
  }

  .search-box{
    grid-column:1/-1;
  }

  .tool-btn{
    min-height:43px;
  }

  .font-grid{
    gap:8px;
  }

  .font-card{
    min-height:126px;
    padding:10px;
    border-radius:15px;
  }

  .preview{
    height:42px;
    font-size:15px;
    margin:6px 0;
  }

  .font-name{
    font-size:7px;
    letter-spacing:.8px;
  }

  .badge{
    font-size:6px;
    padding:4px 5px;
  }

  .action{
    padding:7px 8px;
    font-size:8px;
  }

  .favorite-btn{
    width:29px;
  }
}

@media(max-width:380px){

  .font-grid{
    gap:7px;
  }

  .font-card{
    padding:8px;
  }

  .preview{
    font-size:13px;
  }

  .action{
    padding:6px 7px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">

    <div class="logo">
      DIPO<span>BIO</span>
    </div>

    <div class="nav-right">

<main class="container">

<script>

/* =========================================================
   DIPO BIO — 2050 FONT ENGINE
========================================================= */

const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const a = "abcdefghijklmnopqrstuvwxyz";


/* =========================================================
   UNICODE FONT MAPS
========================================================= */

const boldU =
"𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭";

const boldL =
"𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇";


const italicU =
"𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡";

const italicL =
"𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻";


const boldItalicU =
"𝘼𝘽𝘾𝘿𝙀𝙁𝙂𝙃𝙄𝙅𝙆𝙇𝙈𝙉𝙊𝙋𝙌𝙍𝙎𝙏𝙐𝙑𝙒𝙓𝙔𝙕";

const boldItalicL =
"𝙖𝙗𝙘𝙙𝙚𝙛𝙜𝙝𝙞𝙟𝙠𝙡𝙢𝙣𝙤𝙥𝙦𝙧𝙨𝙩𝙪𝙫𝙬𝙭𝙮𝙯";


const sansU =
"𝖠𝖡𝖢𝖣𝖤𝖥𝖦𝖧𝖨𝖩𝖪𝖫𝖬𝖭𝖮𝖯𝖰𝖱𝖲𝖳𝖴𝖵𝖶𝖷𝖸𝖹";

const sansL =
"𝖺𝖻𝖼𝖽𝖾𝖿𝗀𝗁𝗂𝗃𝗄𝗅𝗆𝗇𝗈𝗉𝗊𝗋𝗌𝗍𝗎𝗏𝗐𝗑𝗒𝗓";


const frakturU =
"𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ";

const frakturL =
"𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷";


const scriptU =
"𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵";

const scriptL =
"𝒶𝒷𝒸𝒹ℯ𝒻ℊ𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏";


const boldFrakturU =
"𝕬𝕭𝕮𝕯𝕰𝕱𝕲𝕳𝕴𝕵𝕶𝕷𝕸𝕹𝕺𝕻𝕼𝕽𝕾𝕿𝖀𝖁𝖂𝖃𝖄𝖅";

const boldFrakturL =
"𝖆𝖇𝖈𝖉𝖊𝖋𝖌𝖍𝖎𝖏𝖐𝖑𝖒𝖓𝖔𝖕𝖖𝖗𝖘𝖙𝖚𝖛𝖜𝖝𝖞𝖟";


const boldScriptU =
"𝓐𝓑𝓒𝓓𝓔𝓕𝓖𝓗𝓘𝓙𝓚𝓛𝓜𝓝𝓞𝓟𝓠𝓡𝓢𝓣𝓤𝓥𝓦𝓧𝓨𝓩";

const boldScriptL =
"𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓵𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃";


const smallCaps =
"ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ";


const circledU =
"ⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ";

const circledL =
"ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩ";


const squared =
"🄰🄱🄲🄳🄴🄵🄶🄷🄸🄹🄺🄻🄼🄽🄾🄿🅀🅁🅂🅃🅄🅅🅆🅇🅈🅉";


const negativeSquared =
"🅰🅱🅲🅳🅴🅵🅶🅷🅸🅹🅺🅻🅼🅽🅾🅿🆀🆁🆂🆃🆄🆅🆆🆇🆈🆉";


/* =========================================================
   CONVERTERS
========================================================= */

function convert(text,upper,lower){

  return Array.from(text).map(ch=>{

    const ui=A.indexOf(ch);

    if(ui!==-1 && upper[ui]){
      return upper[ui];
    }

    const li=a.indexOf(ch);

    if(li!==-1 && lower[li]){
      return lower[li];
    }

    return ch;

  }).join("");

}


function sameMap(text,map){

  return Array.from(text).map(ch=>{

    const i=A.indexOf(ch.toUpperCase());

    return i>=0 && map[i]
      ? map[i]
      : ch;

  }).join("");

}


function effect(text,mark){

  return Array.from(text).map(ch=>{

    if(/[A-Za-z0-9]/.test(ch)){
      return ch+mark;
    }

    return ch;

  }).join("");

}


function spaced(text){

  return Array.from(text).join(" ");

}


/* =========================================================
   STYLE LIBRARY
========================================================= */

const styles=[];

function add(name,category,badge,fn,tags=[]){

  styles.push({
    id:name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),
    name,
    category,
    badge,
    fn,
    tags:[name,category,badge,...tags]
      .join(" ")
      .toLowerCase()
  });

}


/* =========================================================
   REAL UNICODE FONTS
========================================================= */

add(
  "Bold",
  "unicode",
  "CORE",
  t=>convert(t,boldU,boldL),
  ["font"]
);

add(
  "Italic",
  "unicode",
  "CORE",
  t=>convert(t,italicU,italicL)
);

add(
  "Bold Italic",
  "unicode",
  "CORE",
  t=>convert(t,boldItalicU,boldItalicL)
);

add(
  "Sans Serif",
  "unicode",
  "NEW",
  t=>convert(t,sansU,sansL)
);

add(
  "Sans Bold",
  "unicode",
  "NEW",
  t=>convert(t,boldU,boldL)
);

add(
  "Sans Italic",
  "unicode",
  "NEW",
  t=>convert(t,italicU,italicL)
);

add(
  "Sans Bold Italic",
  "unicode",
  "GOD",
  t=>convert(t,boldItalicU,boldItalicL)
);

add(
  "Fraktur",
  "unicode",
  "NEW",
  t=>convert(t,frakturU,frakturL)
);

add(
  "Blackletter",
  "unicode",
  "GOD",
  t=>convert(t,boldFrakturU,boldFrakturL)
);

add(
  "Script",
  "unicode",
  "NEW",
  t=>convert(t,scriptU,scriptL)

/* =========================================================

========================================================= */

const textInput=
document.getElementById("textInput");

const counter=
document.getElementById("counter");

const searchInput=
document.getElementById("searchInput");

const fontGrid=
document.getElementById("fontGrid");

const totalCount=
document.getElementById("totalCount");

const empty=
document.getElementById("empty");

const toast=
document.getElementById("toast");

const favoriteFilter=
document.getElementById("favoriteFilter");

let activeCategory="all";
let favoritesOnly=false;

let favorites=
JSON.parse(
  localStorage.getItem("dipoBioFontFavorites") || "[]"
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    toast.classList.remove("show");

  },1700);

}


/* =========================================================
   COPY
========================================================= */

async function copyText(text,button){

  try{

    await navigator.clipboard.writeText(text);

  }catch(error){

    const temp=document.createElement("textarea");

    temp.value=text;

    document.body.appendChild(temp);

    temp.select();

    document.execCommand("copy");

    temp.remove();

  }

  const old=button.textContent;

  button.textContent="✓ Copied";

  button.classList.add("done");

  showToast("✓ COPIED TO CLIPBOARD");

  setTimeout(()=>{

    button.textContent=old;

    button.classList.remove("done");

  },1100);

}


/* =========================================================
   FAVORITES
========================================================= */

function saveFavorites(){

  localStorage.setItem(
    "dipoBioFontFavorites",
    JSON.stringify(favorites)
  );

}


function toggleFavorite(id){

  if(favorites.includes(id)){

    favorites=
      favorites.filter(x=>x!==id);

  }else{

    favorites.push(id);

  }

  saveFavorites();

  render();

  showToast(
    favorites.includes(id)
      ? "★ SAVED TO FAVORITES"
      : "♡ REMOVED"
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const text=
    textInput.value.trim() ||
    "DIPO WORLD";

  const query=
    searchInput.value.trim().toLowerCase();


  let filtered=
    styles.filter(style=>{

      const categoryOK=
        activeCategory==="all" ||
        style.category===activeCategory;

      const searchOK=
        !query ||
        style.tags.includes(query) ||
        style.name.toLowerCase().includes(query) ||
        style.category.toLowerCase().includes(query);

      const favoriteOK=
        !favoritesOnly ||
        favorites.includes(style.id);

      return categoryOK &&
             searchOK &&
             favoriteOK;

    });


  fontGrid.innerHTML="";

  totalCount.textContent=
    filtered.length;

  empty.style.display=
    filtered.length
      ? "none"
      : "block";


  filtered.forEach(style=>{

    const card=
      document.createElement("article");

    card.className=
      "font-card"+
      (
        favorites.includes(style.id)
          ? " favorite"
          : ""
      );


    const top=
      document.createElement("div");

    top.className="card-top";


    const name=
      document.createElement("div");

    name.className="font-name";

    name.textContent=
      style.name;


    const badge=
      document.createElement("div");

    badge.className="badge";

    if(style.badge==="NEW")
      badge.classList.add("new");

    if(style.badge==="GOD")
      badge.classList.add("god");

    if(style.badge==="TRENDING")
      badge.classList.add("trending");

    badge.textContent=
      style.badge;


    top.appendChild(name);

    top.appendChild(badge);


    const preview=
      document.createElement("div");

    preview.className="preview";

    preview.textContent=
      style.fn(text);


    const actions=
      document.createElement("div");

    actions.className="actions";


    const fav=
      document.createElement("button");

    fav.className=
      "action favorite-btn"+
      (
        favorites.includes(style.id)
          ? " active"
          : ""
      );

    fav.textContent=
      favorites.includes(style.id)
        ? "★"
        : "♡";

    fav.title="Favorite";


    fav.addEventListener(
      "click",
      ()=>toggleFavorite(style.id)
    );


    const remix=
      document.createElement("button");

    remix.className=
      "action remix-btn";

    remix.textContent=
      "🔄 Remix";


    remix.addEventListener(
      "click",
      ()=>{

        const random=
          comboFonts[
            Math.floor(
              Math.random()*comboFonts.length
            )
          ];

        const symbols=
          comboSymbols[
            Math.floor(
              Math.random()*comboSymbols.length
            )
          ];

        const newText=
          symbols[0]+
          random(text)+
          symbols[1];

        preview.textContent=
          newText;

        copy.dataset.text=
          newText;

        showToast("✦ REMIXED");

      }
    );


    const copy=
      document.createElement("button");

    copy.className=
      "action copy-btn";

    copy.textContent=
      "Copy";

    copy.dataset.text=
      style.fn(text);


    copy.addEventListener(
      "click",
      ()=>copyText(
        copy.dataset.text,
        copy
      )
    );


    actions.appendChild(fav);
    actions.appendChild(remix);
    actions.appendChild(copy);


    card.appendChild(top);
    card.appendChild(preview);
    card.appendChild(actions);

    fontGrid.appendChild(card);

  });

}

========================================================= */

.addEventListener(
  "click",
  ()=>{

    const text=
      textInput.value.trim() ||
      "DIPO WORLD";

    const randomStyle=
      styles[
        Math.floor(
          Math.random()*styles.length

    searchInput.value="";

    activeCategory="all";

    document
      .querySelectorAll(".category-btn")
      .forEach(btn=>{

        btn.classList.toggle(
          "active",
          btn.dataset.category==="all"
        );

      });


    render();

    setTimeout(()=>{

      const cards=
        document.querySelectorAll(
          ".font-card"
        );

      const index=
        styles.findIndex(
          s=>s.id===randomStyle.id
        );

      if(cards[index]){

        cards[index].scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      }

      showToast(
        "🎲 "+randomStyle.name
      );

    },50);

  }
);

========================================================= */

counter.textContent=
  textInput.value.length;
