<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>DIPO BIO — Symbols</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(0,255,170,.08),transparent 30%),
    #050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:28px 28px;
  opacity:.18;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:18px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(5,5,5,.82);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#00ff88;
  text-shadow:0 0 18px rgba(0,255,136,.35);
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:15px;
  transition:.2s;
}

.back:hover{
  color:#00ff88;
}

/* ================= HERO ================= */

main{
  padding:55px 0 150px;
}

.hero{
  text-align:center;
  max-width:780px;
  margin:0 auto;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 13px;
  border:1px solid rgba(0,255,136,.25);
  background:rgba(0,255,136,.06);
  color:#00ff88;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:18px;
}

h1{
  font-size:clamp(42px,8vw,76px);
  line-height:.95;
  margin:0;
  font-weight:950;
  letter-spacing:-4px;
}

.gradient{
  background:linear-gradient(90deg,#fff,#9ffff0,#00ff88);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  color:#858585;
  font-size:17px;
  margin:20px auto 28px;
  line-height:1.6;
}

/* ================= SEARCH ================= */

.search-wrap{
  position:relative;
  max-width:700px;
  margin:0 auto;
}

.search{
  width:100%;
  height:58px;
  border-radius:18px;
  border:1px solid #252525;
  outline:none;
  background:#0c0c0c;
  color:#fff;
  padding:0 55px 0 20px;
  font-size:16px;
  box-shadow:0 0 0 1px rgba(255,255,255,.01);
  transition:.25s;
}

.search:focus{
  border-color:#00ff88;
  box-shadow:
    0 0 0 4px rgba(0,255,136,.08),
    0 0 30px rgba(0,255,136,.08);
}

.search-icon{
  position:absolute;
  right:19px;
  top:17px;
  font-size:22px;
  color:#777;
}

/* ================= ACTIONS ================= */

.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:15px;
}

.action{
  border:1px solid #282828;
  background:#0c0c0c;
  color:#ddd;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:.2s;
}

.action:hover{
  border-color:#00ff88;
  color:#00ff88;
  transform:translateY(-1px);
}

/* ================= STATS ================= */

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:24px;
  flex-wrap:wrap;
}

.stat{
  min-width:120px;
  padding:12px 16px;
  border-radius:14px;
  background:#0b0b0b;
  border:1px solid #202020;
}

.stat strong{
  display:block;
  color:#00ff88;
  font-size:19px;
}

.stat span{
  color:#666;
  font-size:11px;
}

/* ================= CATEGORY NAV ================= */

.category-nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:28px 2px 8px;
  scrollbar-width:none;
}

.category-nav::-webkit-scrollbar{
  display:none;
}

.cat-btn{
  flex:none;
  border:1px solid #242424;
  background:#0b0b0b;
  color:#999;
  padding:9px 13px;
  border-radius:999px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  transition:.2s;
}

.cat-btn:hover,
.cat-btn.active{
  background:#00ff88;
  border-color:#00ff88;
  color:#00150b;
}

/* ================= CATEGORY ================= */

.category{
  margin-top:42px;
  scroll-margin-top:100px;
}

.category-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.category-title{
  margin:0;
  font-size:25px;
  letter-spacing:-1px;
}

.category-title span{
  color:#00ff88;
}

.category-description{
  margin:4px 0 0;
  color:#666;
  font-size:12px;
}

/* ================= SYMBOL GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.symbol-card{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border:1px solid #222;
  background:
    linear-gradient(145deg,#101010,#090909);
  border-radius:15px;
  cursor:pointer;
  transition:
    transform .18s,
    border-color .18s,
    background .18s,
    box-shadow .18s;
  user-select:none;
}

.symbol-card:hover{
  transform:translateY(-3px);
  border-color:#00ff88;
  background:#0d1713;
  box-shadow:
    0 8px 30px rgba(0,255,136,.08),
    inset 0 0 20px rgba(0,255,136,.03);
}

.symbol-card:active{
  transform:scale(.95);
}

.symbol{
  font-size:28px;
  line-height:1;
  text-align:center;
  max-width:90%;
  word-break:break-word;
}

.kaomoji-card{
  min-height:92px;
}

.kaomoji-card .symbol{
  font-size:17px;
  line-height:1.35;
}

.copy-mini{
  position:absolute;
  bottom:6px;
  right:7px;
  font-size:9px;
  color:#444;
  opacity:0;
  transition:.2s;
}

.symbol-card:hover .copy-mini{
  opacity:1;
}

/* ================= SIMILAR / FEEDBACK ================= */

.tools{
  position:absolute;
  left:6px;
  right:6px;
  bottom:6px;
  display:flex;
  justify-content:space-between;
  gap:5px;
  opacity:0;
  transform:translateY(4px);
  transition:.2s;
}

.symbol-card:hover .tools{
  opacity:1;
  transform:translateY(0);
}

.similar,
.feedback{
  border:1px solid #292929;
  background:#171717;
  color:#aaa;
  border-radius:8px;
  font-size:10px;
  padding:5px 7px;
  cursor:pointer;
}

.similar:hover{
  color:#00ff88;
  border-color:#00ff88;
}

.feedback:hover{
  color:#fff;
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  padding:70px 20px;
  color:#666;
  display:none;
}

.empty .big{
  font-size:45px;
  margin-bottom:10px;
}

/* ================= CUSTOM ================= */

.custom-box{
  margin-top:60px;
  padding:22px;
  border-radius:20px;
  border:1px solid rgba(0,255,136,.22);
  background:
    linear-gradient(145deg,rgba(0,255,136,.05),rgba(255,255,255,.015));
}

.custom-title{
  font-size:19px;
  font-weight:850;
  margin-bottom:5px;
}

.custom-sub{
  color:#666;
  font-size:12px;
  margin-bottom:15px;
}

.custom-row{
  display:flex;
  gap:9px;
}

.custom-input{
  flex:1;
  min-width:0;
  height:48px;
  border-radius:13px;
  border:1px solid #292929;
  background:#070707;
  color:#fff;
  padding:0 14px;
  outline:none;
}

.custom-input:focus{
  border-color:#00ff88;
}

.submit{
  height:48px;
  border:0;
  padding:0 18px;
  border-radius:13px;
  background:#00ff88;
  color:#00170c;
  font-weight:900;
  cursor:pointer;
}

.submit:hover{
  box-shadow:0 0 25px rgba(0,255,136,.2);
}

.custom-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.custom-item{
  padding:9px 12px;
  border-radius:10px;
  background:#0c0c0c;
  border:1px solid #242424;
  cursor:pointer;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  z-index:100;
  padding:12px 18px;
  border-radius:999px;
  background:#00ff88;
  color:#00150b;
  font-size:13px;
  font-weight:900;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  box-shadow:0 8px 35px rgba(0,255,136,.25);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  h1{
    letter-spacing:-2.5px;
  }

}

@media(max-width:520px){

  .container{
    width:calc(100% - 28px);
  }

  header{
    padding:15px 0;
  }

  .logo{
    font-size:22px;
  }

  .back{
    font-size:13px;
  }

  main{
    padding-top:38px;
  }

  .subtitle{
    font-size:15px;
  }

  .grid{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }

  .symbol-card{
    min-height:74px;
    border-radius:13px;
  }

  .symbol{
    font-size:25px;
  }

  .kaomoji-card{
    min-height:84px;
  }

  .kaomoji-card .symbol{
    font-size:14px;
  }

  .tools{
    display:none;
  }

  .custom-row{
    flex-direction:column;
  }

  .submit{
    width:100%;
  }

}

/* ================= EXTRA GLOW ================= */

@keyframes pulse{
  0%,100%{box-shadow:0 0 0 rgba(0,255,136,0)}
  50%{box-shadow:0 0 25px rgba(0,255,136,.08)}
}

.badge{
  animation:pulse 3s infinite;
}
</style>
</head>

/* =========================================================
   BUILD UI
========================================================= */

const root = document.getElementById("categories");
const nav = document.getElementById("categoryNav");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

let allSymbols = [];
let visibleSymbols = [];

Object.entries(categories).forEach(([name,data],index)=>{

  const id = "cat-" + index;

  /* navigation */

  const navButton = document.createElement("button");

  navButton.className =
    "cat-btn" + (index === 0 ? " active" : "");

  navButton.textContent = name;

  navButton.onclick = ()=>{

    document.getElementById(id)
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    document
      .querySelectorAll(".cat-btn")
      .forEach(x=>x.classList.remove("active"));

    navButton.classList.add("active");
  };

  nav.appendChild(navButton);


  /* category */

  const section = document.createElement("section");

  section.className = "category";
  section.id = id;
  section.dataset.name = name.toLowerCase();

  section.innerHTML = `
    <div class="category-head">
      <div>
        <h2 class="category-title">
          ${name}
        </h2>
        <p class="category-description">
          ${data.desc}
        </p>
      </div>
    </div>
  `;

  const grid = document.createElement("div");
  grid.className = "grid";

  data.items.forEach(symbol=>{

    allSymbols.push({
      symbol,
      category:name
    });

    const card = createCard(
      symbol,
      data.kaomoji === true
    );

    grid.appendChild(card);
  });

  section.appendChild(grid);
  root.appendChild(section);
});


document.getElementById("totalCount").textContent =
  allSymbols.length + "+";


/* =========================================================
   CREATE SYMBOL CARD
========================================================= */

function createCard(symbol,isKaomoji=false){

  const card = document.createElement("div");

  card.className =
    "symbol-card" +
    (isKaomoji ? " kaomoji-card" : "");

  card.dataset.symbol = symbol.toLowerCase();

  card.innerHTML = `
    <div class="symbol">${escapeHTML(symbol)}</div>

    <div class="copy-mini">
      TAP TO COPY
    </div>

    <div class="tools">

      <button class="similar">
        ⌕ similar
      </button>

      <button class="feedback">
        ♡
      </button>

    </div>
  `;

  /* copy */

  card.addEventListener("click",(e)=>{

    if(
      e.target.classList.contains("similar") ||
      e.target.classList.contains("feedback")
    ){
      return;
    }

    copyText(symbol);
  });


  /* similar */

  card.querySelector(".similar")
    .addEventListener("click",e=>{

      e.stopPropagation();

      findSimilar(symbol);

    });


  /* feedback */

  card.querySelector(".feedback")
    .addEventListener("click",e=>{

      e.stopPropagation();

      e.target.textContent = "♥";

      showToast("Thanks for the feedback ♡");

    });


  return card;
}


/* =========================================================
   COPY
========================================================= */

function copyText(text){

  navigator.clipboard.writeText(text)
    .then(()=>{
      showToast("✓ Copied to clipboard");
    })
    .catch(()=>{
      fallbackCopy(text);
    });
}


function fallbackCopy(text){

  const textarea =
    document.createElement("textarea");

  textarea.value = text;

  document.body.appendChild(textarea);

  textarea.select();

  document.execCommand("copy");

  textarea.remove();

  showToast("✓ Copied");
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },1600);
}


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener("input",()=>{

  const query =
    search.value.toLowerCase().trim();

  let found = 0;

  document
    .querySelectorAll(".category")
    .forEach(section=>{

      let categoryFound = 0;

      section
        .querySelectorAll(".symbol-card")
        .forEach(card=>{

          const symbol =
            card.dataset.symbol;

          const category =
            section.dataset.name;

          const match =
            !query ||
            symbol.includes(query) ||
            category.includes(query);

          card.style.display =
            match ? "flex" : "none";

          if(match){
            categoryFound++;
            found++;
          }

        });

      section.style.display =
        categoryFound ? "block" : "none";

    });

  empty.style.display =
    found ? "none" : "block";

});


/* =========================================================
   RANDOM
========================================================= */

function randomSymbol(){

  if(!allSymbols.length) return;

  const item =
    allSymbols[
      Math.floor(
        Math.random()*allSymbols.length
      )
    ];

  copyText(item.symbol);

  search.value = "";

  document
    .querySelectorAll(".category")
    .forEach(section=>{
      section.style.display="block";

      section
        .querySelectorAll(".symbol-card")
        .forEach(card=>{
          card.style.display="flex";
        });
    });

  empty.style.display="none";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   SIMILAR
========================================================= */

function findSimilar(symbol){

  const first =
    symbol.charAt(0);

  let matches =
    allSymbols.filter(item=>
      item.symbol.includes(first)
    );

  if(!matches.length){
    matches = allSymbols;
  }

  const result =
    matches[
      Math.floor(
        Math.random()*matches.length
      )
    ];

  copyText(result.symbol);
}


/* =========================================================
   COPY VISIBLE
========================================================= */

function copyVisible(){

  const visible = [];

  document
    .querySelectorAll(".symbol-card")
    .forEach(card=>{

      if(card.style.display !== "none"){

        visible.push(
          card.dataset.symbol
        );

      }

    });

  if(!visible.length){

    showToast("Nothing visible");

    return;
  }

  copyText(
    visible.slice(0,100).join(" ")
  );
}


/* =========================================================
   CUSTOM KAOMOJI
========================================================= */

let customItems =
  JSON.parse(
    localStorage.getItem("dipoCustomKaomoji") || "[]"
  );


function renderCustom(){

  const list =
    document.getElementById("customList");

  list.innerHTML = "";

  customItems.forEach(item=>{

    const el =
      document.createElement("div");

    el.className="custom-item";

    el.textContent=item;

    el.onclick=()=>{
      copyText(item);
    };

    list.appendChild(el);

  });
}


function addCustom(){

  const input =
    document.getElementById("customInput");

  const value =
    input.value.trim();

  if(!value){

    showToast("Type something first ✨");

    return;
  }

  customItems.unshift(value);

  customItems =
    [...new Set(customItems)]
      .slice(0,50);

  localStorage.setItem(
    "dipoCustomKaomoji",
    JSON.stringify(customItems)
  );

  input.value="";

  renderCustom();

  copyText(value);
}


document
  .getElementById("customInput")
  .addEventListener("keydown",e=>{

    if(e.key==="Enter"){
      addCustom();
    }

  });


renderCustom();


/* =========================================================
   SCROLL CUSTOM
========================================================= */

function scrollToCustom(){

  document
    .getElementById("customBox")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener("keydown",e=>{

  if(
    (e.ctrlKey || e.metaKey) &&
    e.key.toLowerCase()==="k"
  ){

    e.preventDefault();

    search.focus();

  }

});
