<!-- DIPO WORLD — Share Card -->

<template id="share-card-template">

  <div class="share-card">

    <div class="share-card-header">

      <div class="share-card-brand">
        dipo World
      </div>

      <button
        type="button"
        class="share-card-close"
        data-action="close-share"
        aria-label="Close"
      >
        ×
      </button>

    </div>

    <div class="share-card-preview">

      <div
        class="share-preview-content"
        data-share-preview
      >
        Preview
      </div>

    </div>

    <div class="share-card-info">

      <h3 data-share-title>
        Share your creation
      </h3>

      <p data-share-description>
        Share your DIPO WORLD creation with your friends.
      </p>

    </div>

    <div class="share-card-actions">

      <button
        type="button"
        class="share-action"
        data-share-method="native"
      >
        ↗ Share
      </button>

      <button
        type="button"
        class="share-action"
        data-share-method="copy"
      >
        ⧉ Copy Link
      </button>

    </div>

  </div>

</template>
