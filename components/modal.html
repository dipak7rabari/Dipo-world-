<!-- DIPO WORLD — Global Modal -->

<div
  id="global-modal"
  class="modal-overlay"
  hidden
  aria-hidden="true"
>

  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >

    <div class="modal-header">

      <div>

        <span
          class="modal-eyebrow"
          id="modal-eyebrow"
        >
          DIPO WORLD
        </span>

        <h2 id="modal-title">
          Modal Title
        </h2>

      </div>

      <button
        type="button"
        class="modal-close"
        data-action="close-modal"
        aria-label="Close"
      >
        ×
      </button>

    </div>

    <div
      class="modal-body"
      id="modal-body"
    >
      Modal content
    </div>

    <div
      class="modal-footer"
      id="modal-footer"
    ></div>

  </div>

</div>
