<!-- DIPO WORLD — PWA Install Banner -->

<div
  id="install-banner"
  class="install-banner"
  hidden
>

  <div class="install-banner-icon">
    ✦
  </div>

  <div class="install-banner-content">

    <strong>
      Install DIPO WORLD
    </strong>

    <p>
      Add DIPO WORLD to your home screen for a faster experience.
    </p>

  </div>

  <div class="install-banner-actions">

    <button
      type="button"
      class="button button-primary"
      data-action="install-app"
    >
      Install
    </button>

    <button
      type="button"
      class="button button-ghost"
      data-action="dismiss-install"
      aria-label="Dismiss install banner"
    >
      ×
    </button>

  </div>

</div>
