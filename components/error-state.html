<!-- DIPO WORLD — Error State -->

<template id="error-state-template">

  <section class="error-state">

    <div class="error-state-icon">
      !
    </div>

    <span class="error-state-code">
      Something went wrong
    </span>

    <h2 data-error-title>
      We couldn't complete that.
    </h2>

    <p data-error-message>
      Please try again. Your data has not been intentionally deleted.
    </p>

    <div class="error-state-actions">

      <button
        type="button"
        class="button button-primary"
        data-action="retry"
      >
        Try Again
      </button>

      <button
        type="button"
        class="button button-ghost"
        data-action="go-home"
      >
        Go Home
      </button>

    </div>

  </section>

</template>
